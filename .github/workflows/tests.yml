name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      # The Blade root view resolves the Vite manifest, so Inertia assertions need a real build.
      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml pins the suite to an in-memory SQLite database, so nothing to provision.
      - name: Tests
        run: php artisan test

      # The card model has no test runner of its own. See docs/PARITY.md.
      - name: Card model self-check
        run: |
          npx esbuild resources/js/lib/cardModel.check.ts --bundle --platform=node \
            --alias:@=./resources/js --outfile=check.mjs --format=esm
          node check.mjs
