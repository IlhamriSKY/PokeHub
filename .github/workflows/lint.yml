name: linter

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # --test and --check rather than the writing variants, so a badly formatted
      # pull request fails here instead of being silently fixed and discarded.
      - name: PHP formatting
        run: vendor/bin/pint --test

      - name: Frontend formatting
        run: npm run format:check

      - name: Frontend lint
        run: npm run lint:check

      - name: TypeScript
        run: npm run types
